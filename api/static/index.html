<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Server - Verificación & Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .hidden {
            display: none;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: #666;
        }

        input[type="file"],
        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        #status-message {
            margin-top: 1rem;
            text-align: center;
            font-weight: bold;
        }

        .chat-box {
            border: 1px solid #ddd;
            height: 300px;
            overflow-y: auto;
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
            background: #fafafa;
        }

        .message {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            max-width: 80%;
        }

        .user-msg {
            background: #007bff;
            color: white;
            margin-left: auto;
        }

        .bot-msg {
            background: #e9ecef;
            color: #333;
        }

        .meta {
            font-size: 0.75em;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>MCP Server Orchestrator</h1>

        <!-- Step 1: Verification -->
        <div id="step-verification">
            <h3>Paso 1: Verificación Facial</h3>
            <div class="form-group">
                <label for="image-upload">Sube tu foto para verificar identidad:</label>
                <input type="file" id="image-upload" accept="image/*">
            </div>
            <button onclick="verifyFace()">Verificar</button>
        </div>

        <!-- Step 2: Chat -->
        <div id="step-chat" class="hidden">
            <div id="user-info"
                style="background: #d4edda; color: #155724; padding: 10px; border-radius: 4px; margin-bottom: 15px;">
                Identificado como: <span id="user-name"></span>
            </div>

            <div class="chat-box" id="chat-box"></div>

            <div class="form-group">
                <input type="text" id="question-input" placeholder="Escribe tu pregunta sobre normativa...">
            </div>
            <button onclick="askQuestion()">Enviar Pregunta</button>
        </div>

        <div id="status-message"></div>
    </div>

    <script>
        let currentImageFile = null;

        async function verifyFace() {
            const fileInput = document.getElementById('image-upload');
            if (!fileInput.files[0]) {
                alert("Por favor selecciona una imagen.");
                return;
            }
            currentImageFile = fileInput.files[0];

            const formData = new FormData();
            formData.append('image', currentImageFile);
            // No question sent for verification only

            showMessage("Verificando...", "blue");

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === "success") {
                    showMessage("Identidad verificada.", "green");

                    // Assuming identity data structure from previous steps
                    // If logic differs, adjust here. 
                    // Main.py currently returns {status, identity, answer, request_id}
                    // For verify-only, answer might be null.

                    // However, we need to UPDATE main.py to handle optional question first 
                    // otherwise it might fail or require non-empty question.

                    const name = data.identity && data.identity.name ? data.identity.name : "Usuario";
                    document.getElementById('user-name').innerText = name;

                    document.getElementById('step-verification').classList.add('hidden');
                    document.getElementById('step-chat').classList.remove('hidden');
                } else {
                    showMessage("Verificación fallida: " + (data.message || "Usuario desconocido"), "red");
                }
            } catch (error) {
                showMessage("Error de conexión: " + error.message, "red");
            }
        }

        async function askQuestion() {
            const questionInput = document.getElementById('question-input');
            const question = questionInput.value.trim();
            if (!question) return;

            addMessageToChat(question, 'user-msg');
            questionInput.value = '';

            const formData = new FormData();
            formData.append('image', currentImageFile); // Re-send image for every request as per current stateless API design
            formData.append('question', question);

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (response.ok && data.answer) {
                    let answerText = data.answer.answer || "No se recibió respuesta del bot.";

                    // Append citations if available
                    if (data.answer.citations) {
                        // Format citations simply
                    }

                    addMessageToChat(answerText, 'bot-msg');
                } else {
                    addMessageToChat("Error: No se pudo obtener respuesta.", 'bot-msg');
                }
            } catch (error) {
                addMessageToChat("Error: " + error.message, 'bot-msg');
            }
        }

        function addMessageToChat(text, className) {
            const chatBox = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = 'message ' + className;
            div.innerHTML = text; // Allow HTML for line breaks
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function showMessage(msg, color) {
            const el = document.getElementById('status-message');
            el.innerText = msg;
            el.style.color = color;
        }
    </script>
</body>

</html>
